name: Deploy vote-finder

on:
  push:
    branches: [main, feat/vote-finder]
    paths:
      - "tools/vote-finder/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Vote Finder Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/vote-finder
          command: deploy

      - name: Upload voter guide PDFs to R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/vote-finder
          command: |
            r2 object put "vote-finder-guides/AZ_LD10_Ballot_Guide.pdf" --file "guides/AZ_LD10_Ballot_Guide.pdf" --content-type application/pdf --remote
            r2 object put "vote-finder-guides/AZ_LD11_Ballot_Guide.pdf" --file "guides/AZ_LD11_Ballot_Guide.pdf" --content-type application/pdf --remote
            r2 object put "vote-finder-guides/AZ_LD12_Ballot_Guide.pdf" --file "guides/AZ_LD12_Ballot_Guide.pdf" --content-type application/pdf --remote
